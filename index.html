const faq=[['Which countries can I send parcels to?','We serve international destinations. Availability and the suitable service are confirmed for your destination when you request a quote.'],['How do I get a courier quotation?','Tell us your destination, parcel type and approximate weight using the quote form or WhatsApp.'],['Can I send documents and gifts?','Yes, subject to destination rules, item eligibility and carrier restrictions. Please describe the contents when requesting a quote.'],['How long does international delivery take?','Transit estimates depend on destination, service, customs processing and operational conditions. Our team confirms the available estimate.'],['Can I arrange parcel collection?','Collection or parcel handover options depend on your location and shipment. Contact our team to check availability.'],['How can I get a tracking update?','Send your reference number to our WhatsApp team. Live tracking is only available where a verified carrier system is connected.']];
function faqBlock(){return `<section class="section" id="faq"><div class="container"><div class="section-head"><div><span class="eyebrow">Need a little help?</span><h2>Frequently asked questions.</h2></div><a class="text-link" href="/faq">More questions ${A}</a></div><div class="faq-list">${faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section>`}
function home(){const ds=[['🇬🇧','United Kingdom'],['🇨🇦','Canada'],['🇺🇸','USA'],['🇦🇺','Australia'],['🇳🇿','New Zealand'],['🇮🇹','Italy'],['🇫🇷','France'],['🇩🇪','Germany']].map(([f,n])=>`<a class="destination" href="/quote?direction=export&destination=${encodeURIComponent(n)}"><span class="flag">${f}</span><strong>${n}</strong></a>`).join('');const cards=[['📦','International parcels','Send personal packages to family, friends and customers overseas.','/international-courier'],['✉','Documents & gifts','Careful handling for documents and suitable gift shipments.','/export'],['✈','Express courier','Priority international shipping for time-sensitive items.','/export'],['▣','Business shipments','Courier and cargo support for growing businesses.','/business-logistics']].map(([i,t,d,u])=>`<article class="service-card"><div class="service-icon">${i}</div><h3>${t}</h3><p>${d}</p><a href="${u}">Explore service ${A}</a></article>`).join('');return `<main><section class="hero"><div class="season-spark" aria-hidden="true">${'<i class="flake"></i>'.repeat(5)}</div><div class="container hero-inner"><div class="hero-copy"><span class="eyebrow">Your international courier partner</span><h1>Sri Lanka to <span>the world.</span></h1><p>Send parcels, documents and business shipments overseas with CMB XPRESS.LK.</p><div class="hero-actions">${B('Get a Courier Quote','/quote?direction=export')}<a class="btn btn-light" href="${W('Hello CMB XPRESS.LK, I would like a courier quotation from Sri Lanka.')}" target="_blank" rel="noopener">◉ Chat on WhatsApp</a></div><div class="hero-note">Made simple from Sri Lanka · Wattala, Sri Lanka</div></div><div class="hero-card"><div class="hero-card-top"><div><small>Christmas sending season</small><br><strong>Make every delivery count.</strong></div><span style="font-size:30px">🎁</span></div><div class="route-line"><span class="route-label">Sri Lanka</span><span class="route-label">Worldwide</span></div><a class="mini-link" href="/quote?direction=export">Send a little happiness home ${A}</a></div></div></section><div class="trust-strip"><div class="container trust-grid"><div class="trust-item"><span class="trust-icon">🌍</span><div><strong>Global destinations</strong><span>International delivery options</span></div></div><div class="trust-item"><span class="trust-icon">📦</span><div><strong>Parcels & documents</strong><span>Personal and business</span></div></div><div class="trust-item"><span class="trust-icon">💬</span><div><strong>Helpful support</strong><span>Talk to our team directly</span></div></div><div class="trust-item"><span class="trust-icon">✈</span><div><strong>Courier & air cargo</strong><span>Options for your shipment</span></div></div></div></div><section class="section" id="destinations"><div class="container"><div class="section-head"><div><span class="eyebrow">International delivery</span><h2>Where would you like to send?</h2></div><p>Tell us your destination. Our team will help check the suitable shipping option.</p></div><div class="destinations">${ds}</div><p class="note">Destination and service availability are confirmed when you request a quotation.</p></div></section><section class="section section-soft" id="services"><div class="container"><div class="section-head"><div><span class="eyebrow">Courier solutions</span><h2>Ship what matters.</h2></div><a class="text-link" href="/services">View all services ${A}</a></div><div class="service-grid">${cards}</div></div></section><section class="section"><div class="container"><div class="section-head"><div><span class="eyebrow">A simple process</span><h2>From your door to theirs.</h2></div><p>Our team guides you through each step of your international shipment.</p></div><div class="process">${[['01','Request a quote','Tell us your destination and parcel details.'],['02','Confirm details','Our team checks the available service and rate.'],['03','Hand over your parcel','Arrange handover or collection where available.'],['04','Send it worldwide','Your parcel is processed for international delivery.']].map(([n,t,d])=>`<article class="step"><div class="step-num">${n}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section><section class="section section-soft"><div class="container"><div class="christmas-band"><div><span class="eyebrow">A little joy goes a long way</span><h2>Send a little happiness home.</h2><p>Make this Christmas special with international deliveries from Sri Lanka.</p></div><div class="gift" aria-hidden="true">🎁</div>${B('Send a Christmas parcel','/quote?direction=export','btn btn-gold')}</div></div></section><section class="section"><div class="container import-strip"><div><span class="eyebrow">For importers & businesses</span><h2>Bringing cargo into Sri Lanka?</h2><p>Explore air cargo from China and Thailand, plus separate sea freight options.</p><div class="pills"><span class="pill">China air cargo</span><span class="pill">Thailand imports</span><span class="pill">Sea freight / FCL</span></div><a class="text-link" href="/import">Explore import services ${A}</a></div>${B('Import enquiries','/quote?direction=import','btn btn-light')}</div></section>${faqBlock()}<section class="final-cta"><div class="container final-cta-inner"><div><h2>Ready to send your parcel?</h2><p>Get in touch and request your international courier quotation.</p></div>${B('Get a Courier Quote','/quote?direction=export')}</div></section></main>`}
function pageHero(k,t,d){return `<section class="page-hero"><div class="container"><span class="eyebrow">${k}</span><h1>${t}</h1><p>${d}</p></div></section>`}
function exportPage(){return `<main>${pageHero('International courier from Sri Lanka','Send from Sri Lanka. Reach the world.','Courier services for parcels, documents, gifts and business shipments.')}<section class="page-body"><div class="container"><div class="section-head"><div><span class="eyebrow">Choose your service</span><h2>Find the right way to send.</h2></div><p>Our team confirms available services and transit estimates for your destination.</p></div><div class="service-grid">${[['✈','Express','Priority courier option for urgent shipments.'],['◉','Standard','International courier for regular shipments.'],['📦','Economy','Cost-conscious options for suitable parcels.'],['▣','Business cargo','Shipping support for commercial consignments.']].map(([i,t,d])=>`<article class="service-card"><div class="service-icon">${i}</div><h3>${t}</h3><p>${d}</p><a href="/quote?direction=export&service=${encodeURIComponent(t)}">Request rates ${A}</a></article>`).join('')}</div><p class="note">Any quoted transit window is indicative only and must be confirmed for your destination and service. Customs and operational conditions may affect delivery.</p><div style="margin-top:30px">${B('Request an export quote','/quote?direction=export')}</div></div></section></main>`}
function importPage(){return `<main>${pageHero('Import into Sri Lanka','Bring your cargo home.','Air cargo and sea freight solutions for eligible shipments into Sri Lanka.')}<section class="page-body"><div class="container page-grid"><article class="panel" id="china"><span class="eyebrow">Primary corridor</span><h2>🇨🇳 China air cargo</h2><p>Air cargo from China with eligible supplier collection, receiving, consolidation where applicable, customs clearance support and delivery arrangements.</p><a class="text-link" href="/quote?direction=import&origin=China">Get China import rates ${A}</a></article><article class="panel" id="thailand"><span class="eyebrow">Southeast Asia</span><h2>🇹🇭 Thailand imports</h2><p>Air cargo coordination from Thailand with import documentation assistance and Sri Lankan delivery arrangements.</p><a class="text-link" href="/quote?direction=import&origin=Thailand">Get Thailand rates ${A}</a></article><article class="panel"><span class="eyebrow">Separate service</span><h2>🚢 Sea freight / FCL</h2><p>Full Container Load sea freight quotations and import coordination. Routes, container availability and terms are confirmed individually.</p><a class="text-link" href="/sea-freight">Explore sea freight ${A}</a></article><article class="panel"><span class="eyebrow">Need assistance?</span><h2>Let's discuss your cargo.</h2><p>Share the product type, origin, estimated weight and supplier details so our team can review your shipment.</p><a class="text-link" href="/quote?direction=import">Request an import quote ${A}</a></article></div></section></main>`}
function quotePage(){const dir=params.get('direction')==='import'?'import':'export';return `<main>${pageHero('Shipping enquiry','Request a courier quote.','Share a few shipment details. Our team will follow up through WhatsApp.')}<section class="page-body"><div class="container"><form class="form-wrap" id="quoteForm"><div class="form-grid"><div class="field"><label for="direction">Shipment direction *</label><select id="direction" name="direction"><option value="export" ${dir==='export'?'selected':''}>Export from Sri Lanka</option><option value="import" ${dir==='import'?'selected':''}>Import into Sri Lanka</option></select></div><div class="field"><label for="service">Service *</label><select id="service" name="service" required><option>International courier</option><option>Express</option><option>Standard</option><option>Economy</option><option>Air cargo</option><option>Sea freight / FCL</option><option>Business shipment</option></select></div><div class="field"><label for="origin">Origin *</label><input id="origin" name="origin" required value="${dir==='export'?'Sri Lanka':params.get('origin')||'China'}"></div><div class="field"><label for="destination">Destination *</label><input id="destination" name="destination" required value="${dir==='export'?params.get('destination')||'':'Sri Lanka'}" placeholder="Country / city"></div><div class="field"><label for="cargo">Shipment type *</label><select id="cargo" name="cargo" required><option>Parcels</option><option>Documents</option><option>Gifts</option><option>Clothing / personal items</option><option>Commercial cargo</option><option>Other</option></select></div><div class="field"><label for="weight">Approximate weight (kg)</label><input id="weight" name="weight" type="number" min="0" step="0.1" placeholder="e.g. 5"></div><div class="field"><label for="name">Your name *</label><input id="name" name="name" required autocomplete="name"></div><div class="field"><label for="phone">WhatsApp number *</label><input id="phone" name="phone" required autocomplete="tel" placeholder="+94 7X XXX XXXX"></div><div class="field full"><label for="notes">Additional details</label><textarea id="notes" name="notes" placeholder="Parcel details, collection requirements or questions"></textarea></div></div><button type="submit" class="btn btn-red" style="margin-top:19px">Continue to WhatsApp →</button><p class="form-note">Your enquiry will open in WhatsApp with the details you entered. This form does not store enquiries in a database.</p><p class="form-status" id="formStatus" aria-live="polite"></p></form></div></section></main>`}
function trackPage(){return `<main>${pageHero('Shipment assistance','Need a tracking update?','Send your reference number to our team. We will help check the available shipment information.')}<section class="page-body"><div class="container"><form class="form-wrap" id="trackForm"><div class="field"><label for="trackingRef">Tracking / reference number *</label><input id="trackingRef" name="trackingRef" required placeholder="Enter your reference number"></div><div class="field" style="margin-top:14px"><label for="trackingPhone">Your WhatsApp number (optional)</label><input id="trackingPhone" name="trackingPhone" placeholder="+94 7X XXX XXXX"></div><button class="btn btn-red" style="margin-top:18px" type="submit">Request tracking assistance →</button><p class="form-note">This is a tracking assistance request, not a live carrier tracking lookup.</p></form></div></section></main>`}
function basicPage(title,desc,content){return `<main>${pageHero('CMB XPRESS.LK',title,desc)}<section class="page-body"><div class="container page-grid">${content}</div></section></main>`}
function routeContent(){switch(page){case'home':return home();case'export':case'international-courier':return exportPage();case'import':return importPage();case'quote':return quotePage();case'track':return trackPage();case'services':return basicPage('Courier services','Choose the service that suits your shipment.',[['International parcels','/international-courier'],['Documents & gifts','/export'],['Business shipments','/business-logistics'],['Import cargo','/import']].map(([t,u])=>`<article class="panel"><h2>${t}</h2><a class="text-link" href="${u}">Explore ${A}</a></article>`).join(''));case'about':return basicPage('Your international courier partner.','Connecting Sri Lanka with people and businesses around the world.',`<article class="panel"><h2>Who we are</h2><p>CMB XPRESS.LK, powered by Buzzard Logistics (Pvt) Ltd, provides international courier and logistics support from Sri Lanka.</p></article><article class="panel"><h2>What we do</h2><p>We help customers send parcels, documents and business shipments overseas, and support eligible import cargo into Sri Lanka.</p></article>`);case'contact':return basicPage('Talk to our team.','Contact CMB XPRESS.LK for courier and cargo enquiries.',`<article class="panel"><h2>Call or WhatsApp</h2><p>${C.phone}</p><a class="text-link" href="${W('Hello CMB XPRESS.LK, I need shipping assistance.')}" target="_blank" rel="noopener">Chat on WhatsApp ${A}</a></article><article class="panel"><h2>Email</h2><p>${C.email}</p><a class="text-link" href="mailto:${C.email}">Email our team ${A}</a></article><article class="panel"><h2>Sri Lanka office</h2><p>${C.address}</p><a class="text-link" href="${C.maps}" target="_blank" rel="noopener">Open Google Maps ${A}</a></article>`);case'faq':return `<main>${pageHero('Help centre','Frequently asked questions.','Quick answers about international courier and cargo services.')}${faqBlock()}</main>`;case'privacy-policy':return basicPage('Privacy Policy','How we use the information you choose to share.',`<article class="panel"><p>When you contact CMB XPRESS.LK or request a quotation, we may receive the contact and shipment details you choose to share. We use this information to respond to your enquiry, prepare a quotation and coordinate the requested service. Do not send passwords, payment-card details or unrelated sensitive information through a quotation form or WhatsApp. Contact ${C.email} for questions.</p></article>`);case'terms':return basicPage('Terms & Conditions','Important information about shipping services.',`<article class="panel"><p>Shipping services are subject to route availability, carrier conditions, item eligibility and applicable laws. Transit windows and quotations are indicative until confirmed for the specific shipment. Customs duties, taxes and other charges depend on the shipment and the agreed quotation. Customers must accurately describe shipment contents and provide required documents.</p></article>`);case'business-logistics':return basicPage('Business shipping support','International shipping solutions for business consignments.',`<article class="panel"><h2>For growing businesses</h2><p>Tell us your shipping route, parcel profile and expected frequency. Our team can review suitable international courier and cargo options.</p><a class="text-link" href="/quote?direction=export">Request a business quote ${A}</a></article>`);case'sea-freight':return basicPage('Sea freight / FCL','Full Container Load sea freight quotations, handled separately from air cargo.',`<article class="panel"><h2>Sea freight solutions</h2><p>Share origin, cargo details and estimated requirements. Availability and rates are confirmed individually.</p><a class="text-link" href="/quote?direction=import&service=Sea%20freight">Request rates ${A}</a></article>`);default:return `<main class="not-found"><div class="container"><span class="eyebrow">Page not found</span><h1>Let's get you back on track.</h1>${B('Go to homepage','/')}</div></main>`}}
function init(){document.getElementById('app').innerHTML=header()+routeContent()+footer()+floating();const t=document.getElementById('menuToggle'),m=document.getElementById('mobileNav');t?.addEventListener('click',()=>{const open=m.classList.toggle('open');t.setAttribute('aria-expanded',String(open));t.setAttribute('aria-label',open?'Close menu':'Open menu');t.textContent=open?'×':'☰'});m?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>m.classList.remove('open')));document.getElementById('quoteForm')?.addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const d=new FormData(f),message=[`Hello ${C.name} team, I would like a shipping quotation.`,`Direction: ${d.get('direction')==='export'?'Export from Sri Lanka':'Import into Sri Lanka'}`,`Service: ${d.get('service')}`,`Origin: ${d.get('origin')}`,`Destination: ${d.get('destination')}`,`Shipment type: ${d.get('cargo')}`,`Approx. weight: ${d.get('weight')||'Not specified'} kg`,`Name: ${d.get('name')}`,`WhatsApp: ${d.get('phone')}`,`Details: ${d.get('notes')||'None'}`].join('\n');document.getElementById('formStatus').textContent='Opening WhatsApp with your enquiry details…';window.location.href=W(message)});document.getElementById('trackForm')?.addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const d=new FormData(f);window.location.href=W(`Hello ${C.name} team, please help me with a tracking update.\nReference: ${d.get('trackingRef')}\nContact: ${d.get('trackingPhone')||'Not provided'}`)});const title={home:'CMB XPRESS.LK | Sri Lanka to the World',export:'International Courier Export from Sri Lanka | CMB XPRESS.LK',import:'Import Cargo into Sri Lanka | CMB XPRESS.LK',quote:'Get a Courier Quote | CMB XPRESS.LK',contact:'Contact CMB XPRESS.LK',about:'About CMB XPRESS.LK',services:'Courier Services | CMB XPRESS.LK'}[page]||'CMB XPRESS.LK | International Courier Partner';document.title=title;const c=document.querySelector('link[rel=canonical]');if(c)c.href='https://www.cmbxpress.lk'+(path==='/'?'/':path)}init();
</script></body></html>
